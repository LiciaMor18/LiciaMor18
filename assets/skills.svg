<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 0 800 412">
  <!-- RPG character sheet. Bars: 470 = empty, 710 = full, 24 per level. -->
  <defs>
    <linearGradient id="xp" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="710" y2="0">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="710" y2="0">
      <stop offset="0" stop-color="#e3b341"/><stop offset="1" stop-color="#f85149"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono','Courier New',monospace">
    <!-- Frame -->
    <rect x="2" y="2" width="796" height="408" rx="10" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <rect x="9" y="9" width="782" height="394" rx="6" fill="none" stroke="#e3b341" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Title -->
    <text x="400" y="45" text-anchor="middle" fill="#e3b341" font-size="20" letter-spacing="4" font-weight="bold" filter="url(#glow)">◆ CHARACTER SHEET ◆</text>
    <line x1="40" y1="62" x2="760" y2="62" stroke="#e3b341" stroke-opacity="0.35" stroke-dasharray="4 4"/>

    <!-- Left column: who you are -->
    <text x="40" y="149" fill="#8b949e" font-size="12" letter-spacing="2">CLASS</text>
    <text x="40" y="172" fill="#e6edf3" font-size="17">Apprentice Programmer</text>
    <text x="40" y="209" fill="#8b949e" font-size="12" letter-spacing="2">ALIGNMENT</text>
    <text x="40" y="232" fill="#e6edf3" font-size="17">Chaotic Good</text>
    <text x="40" y="269" fill="#8b949e" font-size="12" letter-spacing="2">WEAPON OF CHOICE</text>
    <text x="40" y="292" fill="#e6edf3" font-size="17">Obsidian vault</text>

    <line x1="300" y1="82" x2="300" y2="376" stroke="#30363d" stroke-width="1"/>

    <!-- Right column: skills -->
    <g font-size="15">
      <!-- Python: Lv.9 -->
      <text x="330" y="105" fill="#e6edf3">Python</text>
      <line x1="470" y1="100" x2="710" y2="100" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="100" x2="470" y2="100" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="686" begin="0.30s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="105" fill="#3fb950" opacity="0">Lv.9<set attributeName="opacity" to="1" begin="1.40s" fill="freeze"/></text>
      <!-- C: Lv.7 -->
      <text x="330" y="138" fill="#e6edf3">C</text>
      <line x1="470" y1="133" x2="710" y2="133" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="133" x2="470" y2="133" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="638" begin="0.48s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="138" fill="#3fb950" opacity="0">Lv.7<set attributeName="opacity" to="1" begin="1.58s" fill="freeze"/></text>
      <!-- SQL: Lv.6 -->
      <text x="330" y="171" fill="#e6edf3">SQL</text>
      <line x1="470" y1="166" x2="710" y2="166" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="166" x2="470" y2="166" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="614" begin="0.66s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="171" fill="#3fb950" opacity="0">Lv.6<set attributeName="opacity" to="1" begin="1.76s" fill="freeze"/></text>
      <!-- Vue: Lv.6 -->
      <text x="330" y="204" fill="#e6edf3">Vue</text>
      <line x1="470" y1="199" x2="710" y2="199" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="199" x2="470" y2="199" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="614" begin="0.84s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="204" fill="#3fb950" opacity="0">Lv.6<set attributeName="opacity" to="1" begin="1.94s" fill="freeze"/></text>
      <!-- CSS: Lv.6 -->
      <text x="330" y="237" fill="#e6edf3">CSS</text>
      <line x1="470" y1="232" x2="710" y2="232" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="232" x2="470" y2="232" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="614" begin="1.02s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="237" fill="#3fb950" opacity="0">Lv.6<set attributeName="opacity" to="1" begin="2.12s" fill="freeze"/></text>
      <!-- Git: Lv.6 -->
      <text x="330" y="270" fill="#e6edf3">Git</text>
      <line x1="470" y1="265" x2="710" y2="265" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="265" x2="470" y2="265" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="614" begin="1.20s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="270" fill="#3fb950" opacity="0">Lv.6<set attributeName="opacity" to="1" begin="2.30s" fill="freeze"/></text>
      <!-- Java: Lv.5 -->
      <text x="330" y="303" fill="#e6edf3">Java</text>
      <line x1="470" y1="298" x2="710" y2="298" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="298" x2="470" y2="298" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="590" begin="1.38s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="303" fill="#3fb950" opacity="0">Lv.5<set attributeName="opacity" to="1" begin="2.48s" fill="freeze"/></text>
      <!-- Typst: Lv.5 -->
      <text x="330" y="336" fill="#e6edf3">Typst</text>
      <line x1="470" y1="331" x2="710" y2="331" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="331" x2="470" y2="331" stroke="url(#xp)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="590" begin="1.56s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </line>
      <text x="725" y="336" fill="#3fb950" opacity="0">Lv.5<set attributeName="opacity" to="1" begin="2.66s" fill="freeze"/></text>
      <!-- Coffee: MAX -->
      <text x="330" y="369" fill="#e3b341">Coffee</text>
      <line x1="470" y1="364" x2="710" y2="364" stroke="#21262d" stroke-width="14" stroke-dasharray="20 4"/>
      <line x1="470" y1="364" x2="470" y2="364" stroke="url(#fire)" stroke-width="14" stroke-dasharray="20 4">
        <animate attributeName="x2" from="470" to="710" begin="1.74s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 0.9 1"/>
      </line>
      <text x="725" y="369" fill="#f85149" font-weight="bold" opacity="0">MAX!
        <animate attributeName="opacity" values="1;0.25;1" dur="0.9s" begin="2.34s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="760" y="396" text-anchor="end" fill="#6e7681" font-size="11">* stats verified by absolutely no one</text>
  </g>
</svg>
